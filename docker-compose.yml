services:
  app:
    build:
      context: .
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    restart: always
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alumnihub -d alumnihub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data: